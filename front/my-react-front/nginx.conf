server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the browser and API on one public origin so the HttpOnly session
    # cookie accompanies protected thumbnail requests. Resolve the Compose
    # gateway at request time because the services can start in either order.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://spring-gateway:8080;

    location = /users { proxy_pass $gateway; include /etc/nginx/proxy_params; }
    location ^~ /auth/ { proxy_pass $gateway; include /etc/nginx/proxy_params; }
    location ^~ /garments { proxy_pass $gateway; include /etc/nginx/proxy_params; }
    location = /recommend { proxy_pass $gateway; include /etc/nginx/proxy_params; }
    location = /analyze { proxy_pass $gateway; include /etc/nginx/proxy_params; }
    location = /health { proxy_pass $gateway; include /etc/nginx/proxy_params; }
    location = /ui { proxy_pass $gateway; include /etc/nginx/proxy_params; }
    location ^~ /thumbnails/ { proxy_pass $gateway; include /etc/nginx/proxy_params; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
