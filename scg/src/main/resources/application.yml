server:
  port: 8080

spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${FRONTEND_ORIGINS:http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8080}
            allowedMethods:
              - "GET"
              - "POST"
              - "DELETE"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # FastAPI 1번
        - id: fastapi-node-1-route
          uri: http://fastapi-node-1:8000
          predicates:
            - Path=/garments, /garments/**, /recommend, /analyze, /health, /ui, /users, /auth/**
            - Weight=ai-group, 5
          filters:
            - AddRequestHeader=X-API-Key, ${API_KEY:default-key}

        # FastAPI 2번
        - id: fastapi-node-2-route
          uri: http://fastapi-node-2:8000
          predicates:
            - Path=/garments, /garments/**, /recommend, /analyze, /health, /ui, /users, /auth/**
            - Weight=ai-group, 5
          filters:
            - AddRequestHeader=X-API-Key, ${API_KEY:default-key}

        # 정적 썸네일 - 1번
        - id: fastapi-node-1-thumbnails
          uri: http://fastapi-node-1:8000
          predicates:
            - Path=/thumbnails/**
            - Weight=thumb-group, 5

        # 정적 썸네일 - 2번
        - id: fastapi-node-2-thumbnails
          uri: http://fastapi-node-2:8000
          predicates:
            - Path=/thumbnails/**
            - Weight=thumb-group, 5

        # React
        - id: react-front-route
          uri: http://react-front:80
          predicates:
            - Path=/**