version: '3.8'

services:
  # [1번 서비스] Spring Cloud Gateway (모든 요청의 단일 창구)
  spring-gateway:
    build:
      context: ./scg
      dockerfile: Dockerfile
    container_name: scg-container
    ports:
      - "8080:8080" # 외부 접속용 8080 포트
    depends_on:
      - fastapi-node-1
      - fastapi-node-2
      - react-front
    environment:
      - API_KEY=${API_KEY}
    networks:
      - backend-network

  # [2번 서비스] React 프론트엔드
  react-front:
    build:
      context: ./front/my-react-front
      dockerfile: Dockerfile
    container_name: react-container
    ports:
      - "80:80"
    networks:
      - backend-network # 💡 Gateway와 통신할 수 있도록 네트워크 추가

  # [3번 서비스] FastAPI 복제본 1번
  fastapi-node-1:
    build:
      context: ./fastapi/fastapi_1
      dockerfile: Dockerfile
    container_name: fastapi-container-1
    ports:
      - "8001:8000"
    environment:
      - SERVER_NAME=FastAPI-Server-1
      - API_KEY=${API_KEY}
    networks:
      - backend-network
    volumes:
      - ./fastapi/fastapi_1:/app
      - thumbnail_data_1:/app/thumbnails
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  # [4번 서비스] FastAPI 복제본 2번
  fastapi-node-2:
    build:
      context: ./fastapi/fastapi_1
      dockerfile: Dockerfile
    container_name: fastapi-container-2
    ports:
      - "8002:8000"
    environment:
      - SERVER_NAME=FastAPI-Server-2
      - API_KEY=${API_KEY}
    networks:
      - backend-network
    volumes:
      - ./fastapi/fastapi_1:/app
      - thumbnail_data_2:/app/thumbnails
    command: uvicorn app:app --host 0.0.0.0 --port 8000

networks:
  backend-network:
    driver: bridge

volumes:
  thumbnail_data_1:
  thumbnail_data_2: